<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لسه ليكي مكان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- الألوان والخطوط ---------- */
:root{
  --black:#08050d; --plum:#1a0b24; --rose:#c2185b; --rose-soft:#f06292;
  --violet:#7b2ff7; --violet-soft:#b388ff; --text:#f6e9f1; --muted:#c9a9c0;
  --display:'Aref Ruqaa','Amiri','Traditional Arabic',serif;
  --body:'Tajawal','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--black);color:var(--text);font-family:var(--body)}
body{background:radial-gradient(ellipse at 50% 0%,#2a0f3d 0%,var(--black) 70%)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* ---------- المشاهد ---------- */
.scene{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));text-align:center;
  opacity:0;visibility:hidden;transform:scale(1.04);filter:blur(10px);
  transition:opacity 1.1s ease,transform 1.1s ease,filter 1.1s ease,visibility 0s 1.1s}
.scene.on{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s}

/* ---------- إطار الصورة المضيء ---------- */
.frame{position:relative;width:min(56vw,230px);aspect-ratio:3/4;border-radius:999px 999px 28px 28px;padding:4px;
  background:conic-gradient(from 0deg,var(--rose),var(--violet),var(--rose-soft),var(--violet-soft),var(--rose));
  box-shadow:0 0 28px rgba(240,98,146,.55),0 0 70px rgba(123,47,247,.4);animation:pulse 3.5s ease-in-out infinite}
.frame::before{content:"";position:absolute;inset:-14px;border-radius:inherit;background:inherit;filter:blur(22px);opacity:.35;z-index:-1}
.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;background:inherit;animation:ring 9s linear infinite alternate;z-index:0;pointer-events:none}
@keyframes ring{to{filter:hue-rotate(40deg)}}
.frame .inner{z-index:1;width:100%;height:100%;border-radius:inherit;overflow:hidden;background:var(--plum);position:relative}
.frame img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;filter:blur(14px);transform:translateY(9%) scale(1.28);
  transition:opacity 2.4s ease,filter 2.4s ease,transform 2.4s ease}
.frame img.shown{opacity:1;filter:none;transform:translateY(9%) scale(1.2)} /* نزول الصورة لتحت داخل الإطار */
.frame .ph{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;cursor:pointer;padding:12px}
.frame .ph svg{width:46px;height:46px;fill:var(--rose-soft);animation:beat 1.6s infinite}
/* الإطار يدور بالتدرج فقط، فنعكس الدوران على المحتوى حتى لا تتحرك الصورة */
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes pulse{50%{box-shadow:0 0 40px rgba(240,98,146,.75),0 0 95px rgba(123,47,247,.55)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}

/* ---------- شاشة البداية ---------- */
#intro .frame{margin-bottom:34px;width:min(40vw,160px)}
.opening{font-family:var(--display);font-size:clamp(1.55rem,6vw,2.5rem);line-height:2;max-width:640px;
  background:linear-gradient(100deg,#fff 10%,var(--rose-soft) 50%,var(--violet-soft));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{font-family:var(--body);font-size:1.1rem;font-weight:500;color:#fff;border:0;cursor:pointer;border-radius:999px;padding:15px 34px;margin-top:34px;
  background:linear-gradient(120deg,var(--rose),var(--violet));box-shadow:0 8px 30px rgba(194,24,91,.45);position:relative;overflow:hidden;
  transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 38px rgba(194,24,91,.65)}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.nav button:focus-visible,.ph:focus-visible{outline:2px solid var(--violet-soft);outline-offset:3px}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 3.2s infinite}
@keyframes shine{to{left:130%}}
.fade-seq>*{opacity:0;transform:translateY(14px);animation:rise 1.4s ease forwards}
.on .fade-seq>*:nth-child(1){animation-delay:.3s}.on .fade-seq>*:nth-child(2){animation-delay:1s}.on .fade-seq>*:nth-child(3){animation-delay:2.4s}
@keyframes rise{to{opacity:1;transform:none}}

/* ---------- القصة ---------- */
#story{justify-content:space-between}
.progress{width:min(86vw,520px);height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose-soft),var(--violet-soft));box-shadow:0 0 12px var(--rose-soft);transition:width .8s ease}
.counter{font-size:.85rem;color:var(--muted);margin-top:10px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:620px}
.page{width:100%;opacity:0;transition:opacity .7s ease}
.page.in{opacity:1}
.page h1{font-family:var(--display);font-size:clamp(2.4rem,10vw,4rem);margin-bottom:26px;
  background:linear-gradient(100deg,var(--rose-soft),#fff,var(--violet-soft));-webkit-background-clip:text;background-clip:text;color:transparent}
.page p{font-family:var(--display);font-size:clamp(1.3rem,4.8vw,1.85rem);line-height:2.15;margin-bottom:18px;
  opacity:0;transform:translateY(16px);filter:blur(6px);transition:opacity 1.2s ease,transform 1.2s ease,filter 1.2s ease}
.page.in p,.page.in h1{opacity:1;transform:none;filter:none}
.page.in p:nth-of-type(1){transition-delay:.2s}.page.in p:nth-of-type(2){transition-delay:1.1s}
.page h1{opacity:0;transform:translateY(16px);transition:opacity 1.2s,transform 1.2s}
.nav{display:flex;gap:14px;justify-content:center;width:100%;padding-bottom:6px}
.nav button{font-family:var(--body);font-size:1rem;color:var(--text);cursor:pointer;border-radius:999px;padding:12px 28px;min-width:110px;
  background:rgba(255,255,255,.06);border:1px solid rgba(240,98,146,.4);backdrop-filter:blur(6px);transition:all .25s}
.nav button:hover:not(:disabled){background:linear-gradient(120deg,var(--rose),var(--violet));border-color:transparent}
.nav button:disabled{opacity:.3;cursor:default}

/* ---------- النهاية ---------- */
#end .frame{margin-bottom:30px}
.closing{font-family:var(--display);font-size:clamp(1.3rem,5vw,1.9rem);line-height:2.1;max-width:560px;color:var(--text);text-shadow:0 0 18px rgba(240,98,146,.5)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;transition-duration:.01s!important}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<!-- ===== شاشة البداية ===== -->
<section class="scene on" id="intro">
  <div class="frame"><div class="inner"></div></div>
  <div class="fade-seq">
    <p class="opening">في كلام كتير جوايا، وكنت محتاج ألاقي طريقة أحكيلك بيه...</p>
    <button class="btn" id="openBtn" type="button">افتحي حكايتنا ❤️</button>
  </div>
</section>

<!-- ===== القصة ===== -->
<section class="scene" id="story" aria-live="polite">
  <div style="width:100%;display:flex;flex-direction:column;align-items:center">
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="bar"></i></div>
    <div class="counter" id="counter"></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="nav">
    <button id="prev" type="button">السابق</button>
    <button id="next" type="button">التالي</button>
  </div>
</section>

<!-- ===== النهاية ===== -->
<section class="scene" id="end">
  <div class="frame"><div class="inner"></div></div>
  <div class="fade-seq">
    <p class="closing">يمكن مش بعرف أعبّر عن كل اللي جوايا، بس حبيت أعملك حاجة تفكرك إنك غالية عندي.</p>
    <button class="btn" id="againBtn" type="button">اقرئي الحكاية من الأول ❤️</button>
  </div>
</section>

/* ---------- نص الرواية (كما هو بدون تعديل) ---------- */
const PAGES = [
  {title:"لسه ليكي مكان", text:["كان فيه بنت دخلت حياتي، ومع الوقت بقيت جزء من يومي وتفاصيلي."]},
  {text:["بقيت أفرح بكلامها، وأهتم بأصغر تفاصيلها، وحتى في أوقات زعلها كنت بتمنى أكون سبب في ضحكتها."]},
  {text:["بس مش كل الأيام بتكون حلوة، ساعات بنفهم بعض غلط، وساعات خوفنا على بعض بيخلينا نتكلم بطريقة مش أحسن حاجة."]},
  {text:["أنا مش بقول إني دايمًا صح، ولا إنك دايمًا غلط، بس كل اللي عايزك تعرفيه إنك غالية عندي، وإن زعلك بيفرق معايا.",
         "مش عايزك تحسي إنك لازم تتغيري عشاني، ولا إني مستني منك تكوني مثالية."]},
  {text:["أنا بس نفسي نهتم ببعض، ونفهم بعض، ومنخليش أي خلاف ينسينا إحنا بدأنا ليه."]},
  {text:["وفي الآخر، أنا مش عايز حكايتنا تكون مجرد ذكرى حلوة، نفسي لسه يكون فيها كلام كتير وضحك وذكريات أحلى.",
         "لسه ليكي مكان، ولسه وجودك فارق معايا. ❤️"]}
];

const $ = s => document.querySelector(s);
const scenes = {intro:$('#intro'), story:$('#story'), end:$('#end')};
let cur = 0, busy = false;

/* ---------- الصورة: عرض تدريجي أو خانة اختيار ---------- */
const HEART = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.2 5 5.6 5c2 0 3.5 1.1 4.4 2.6h4C14.900 6.100 16.400 5 18.400 5 21.800 5 23.600 8.400 22 11.700 19.500 16.400 12 21 12 21z"/></svg>';
function mountPhoto(frame){
  const inner = frame.querySelector('.inner');
  inner.innerHTML = '';
  const show = src => {
    inner.innerHTML = '';
    const img = new Image(); img.alt = 'صورتها'; img.decoding = 'async';
    img.onload = () => { inner.appendChild(img); requestAnimationFrame(()=>setTimeout(()=>img.classList.add('shown'),250)); };
    img.src = src;
  };
  if(PHOTO_SRC){ show(PHOTO_SRC); return; }
  // لا توجد صورة محددة: خانة بسيطة لاختيار صورة من الجهاز (تُعرض محليًا فقط)
  const ph = document.createElement('div'); ph.className = 'ph'; ph.tabIndex = 0; ph.setAttribute('role','button');
  ph.innerHTML = HEART + '<span>اضغطي لاختيار صورة</span>';
  const pick = () => { const f = document.createElement('input'); f.type='file'; f.accept='image/*';
    f.onchange = () => { const file=f.files[0]; if(!file) return; const r=new FileReader();
      r.onload = () => { window.__photo = r.result; document.querySelectorAll('.frame').forEach(fr=>{ if(fr!==frame) fr.querySelector('.inner').innerHTML=''; });
        show(r.result); mountOther(frame); }; r.readAsDataURL(file); }; f.click(); };
  ph.onclick = pick; ph.onkeydown = e => { if(e.key==='Enter'||e.key===' ') pick(); };
  inner.appendChild(ph);
}
// بعد اختيار صورة يدويًا تُستخدم نفس الصورة في الإطار الآخر
function mountOther(frame){
  document.querySelectorAll('.frame').forEach(fr=>{ if(fr===frame) return;
    const inner = fr.querySelector('.inner'); inner.innerHTML='';
    const img = new Image(); img.alt='صورتها'; img.src = window.__photo;
    img.onload = () => { inner.appendChild(img); setTimeout(()=>img.classList.add('shown'),250); }; });
}
document.querySelectorAll('.frame').forEach(mountPhoto);

/* ---------- التنقل بين المشاهد ---------- */
function go(name){
  Object.entries(scenes).forEach(([k,el]) => el.classList.toggle('on', k===name));
  // إعادة تشغيل أنيميشن الظهور المتتابع
  scenes[name].querySelectorAll('.fade-seq>*').forEach(e=>{ e.style.animation='none'; void e.offsetWidth; e.style.animation=''; });
  if(name==='end'){ const img = scenes.end.querySelector('img'); if(img){ img.classList.remove('shown'); setTimeout(()=>img.classList.add('shown'),400);} }
}

/* ---------- عرض صفحات القصة ---------- */
function render(i, dir){
  if(busy) return; busy = true;
  const stage = $('#stage'), old = stage.firstElementChild;
  const build = () => {
    stage.innerHTML = '';
    const d = document.createElement('div'); d.className = 'page';
    const p = PAGES[i];
    if(p.title){ const h = document.createElement('h1'); h.textContent = p.title; d.appendChild(h); }
    p.text.forEach(t => { const e = document.createElement('p'); e.textContent = t; d.appendChild(e); });
    stage.appendChild(d);
    requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('in')));
    $('#bar').style.width = ((i+1)/PAGES.length*100) + '%';
    $('.progress').setAttribute('aria-valuenow', Math.round((i+1)/PAGES.length*100));
    $('#counter').textContent = (i+1) + ' / ' + PAGES.length;
    $('#prev').disabled = i===0;
    $('#next').textContent = i===PAGES.length-1 ? 'النهاية ❤️' : 'التالي';
    setTimeout(()=>busy=false, 500);
  };
  if(old){ old.classList.remove('in'); setTimeout(build, 600); } else build();
}
function next(){ if(busy) return; if(cur < PAGES.length-1){ cur++; render(cur); } else go('end'); }
function prev(){ if(busy) return; if(cur>0){ cur--; render(cur); } }

$('#openBtn').onclick = () => { cur = 0; go('story'); $('#stage').innerHTML=''; setTimeout(()=>render(0), 700); burst(); };
$('#next').onclick = next;
$('#prev').onclick = prev;
$('#againBtn').onclick = () => { cur = 0; go('story'); $('#stage').innerHTML=''; setTimeout(()=>render(0), 700); };

// تنقل بالكيبورد (في RTL السهم الأيسر = التالي)
addEventListener('keydown', e => {
  if(!scenes.story.classList.contains('on')) return;
  if(e.key==='ArrowLeft') next(); if(e.key==='ArrowRight') prev();
});
// تنقل بالسحب على الموبايل
let sx = null;
addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, {passive:true});
addEventListener('touchend', e => {
  if(sx===null || !scenes.story.classList.contains('on')) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if(Math.abs(dx) > 60){ dx < 0 ? next() : prev(); }
}, {passive:true});

/* ============================================================
   الخلفية: نجوم + جزيئات مضيئة + قلوب صغيرة هادئة (Canvas)
   ============================================================ */
const cv = $('#bg'), cx = cv.getContext('2d');
let W, H, DPR, stars = [], dust = [], hearts = [], sparks = [];
const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
function resize(){
  DPR = Math.min(devicePixelRatio||1, 2); W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; cx.setTransform(DPR,0,0,DPR,0,0);
  const area = W*H;
  stars = Array.from({length: Math.round(area/5500)}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.3+.2, t:Math.random()*6.28, s:Math.random()*.02+.005}));
  dust  = Array.from({length: Math.round(area/30000)+8}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*2.6+1, vx:(Math.random()-.5)*.25, vy:-Math.random()*.25-.05, c:Math.random()<.5?'240,98,146':'179,136,255', t:Math.random()*6.28}));
  hearts = Array.from({length: Math.round(area/70000)+6}, () => newHeart(true));
}
function newHeart(init){ return {x:Math.random()*W, y: init? Math.random()*H : H+30, s:Math.random()*9+7, v:Math.random()*.3+.15, ph:Math.random()*6.28, a:Math.random()*.25+.15, c:Math.random()<.6?'240,98,146':'179,136,255'}; }
function heartPath(x,y,s){ cx.beginPath(); cx.moveTo(x,y+s*.35);
  cx.bezierCurveTo(x-s,y-s*.3, x-s*.6,y-s, x,y-s*.45); cx.bezierCurveTo(x+s*.6,y-s, x+s,y-s*.3, x,y+s*.35); cx.fill(); }
function burst(){ for(let i=0;i<26;i++){ const a=Math.random()*6.28, v=Math.random()*3+1; sparks.push({x:W/2,y:H/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:Math.random()<.5?'240,98,146':'179,136,255'}); } }
function draw(){
  cx.clearRect(0,0,W,H);
  for(const s of stars){ s.t += s.s; const a = .35 + Math.sin(s.t)*.35; cx.fillStyle = `rgba(255,240,250,${Math.max(a,.05)})`; cx.beginPath(); cx.arc(s.x,s.y,s.r,0,6.28); cx.fill(); }
  for(const d of dust){
    d.x += d.vx; d.y += d.vy; d.t += .02; if(d.y < -10) d.y = H+10; if(d.x<-10) d.x=W+10; if(d.x>W+10) d.x=-10;
    const g = cx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r*5); const a = .35+Math.sin(d.t)*.15;
    g.addColorStop(0,`rgba(${d.c},${a})`); g.addColorStop(1,`rgba(${d.c},0)`); cx.fillStyle = g; cx.beginPath(); cx.arc(d.x,d.y,d.r*5,0,6.28); cx.fill();
  }
  for(let i=0;i<hearts.length;i++){
    const h = hearts[i]; h.y -= h.v; h.ph += .015; const x = h.x + Math.sin(h.ph)*16;
    cx.fillStyle = `rgba(${h.c},${h.a})`; cx.shadowColor = `rgba(${h.c},.8)`; cx.shadowBlur = 12; heartPath(x,h.y,h.s); cx.shadowBlur = 0;
    if(h.y < -30) hearts[i] = newHeart(false);
  }
  for(let i=sparks.length-1;i>=0;i--){ const p=sparks[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.03; p.l-=.015;
    if(p.l<=0){ sparks.splice(i,1); continue; } cx.fillStyle=`rgba(${p.c},${p.l})`; heartPath(p.x,p.y,6*p.l+2); }
  if(!still) requestAnimationFrame(draw);
}
addEventListener('resize', resize);
resize(); draw();
if(still) draw();
</script>
</body>
</html>
